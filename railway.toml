# Railway Config as Code — app service.
# https://docs.railway.com/cli/templates
#
# Template wiring (done in the Railway dashboard / Template Composer,
# not in this file — there is no template.json format):
#   - No extra services are needed. The notes store is a SQLite file
#     (DATABASE_PATH, default data/notes.db) created on startup.
#   - Optional persistence: add a Railway Volume mounted at /app/data
#     so the SQLite file survives redeploys. WITHOUT a volume the file
#     is ephemeral and notes are lost on redeploy — the app says so in
#     /api/health and on the landing page.
#   - Optional auth: set MCP_AUTH_TOKEN as a service variable. Without
#     it the /mcp endpoint is open.
#   - Healthcheck must return HTTP 200 directly (no redirect).

[build]
builder = "RAILPACK"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# No preDeployCommand: SQLite is initialised on app startup
# (app/main.py startup event calls store.init_db, create + seed if empty).
# No PORT setting needed: Railway injects $PORT at runtime and the
# startCommand binds it explicitly.
